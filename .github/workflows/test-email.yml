
name: Test E-Mail bei Fehler

on:
  workflow_dispatch:

jobs:
  test-email:
    runs-on: ubuntu-latest

    steps:
      - name: Absichtlich einen Fehler auslösen
        run: |
          echo "Dies ist ein absichtlicher Testfehler."
          exit 1

      - name: Testmail nach Fehler versenden
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: mail.gmx.net
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: ${{ secrets.MAIL_USERNAME }}
          to: knoblauch@dezim-institut.de,khalil@dezim-institut.de,harder@dezim-institut.de
          subject: "TEST: BAMF-Scraper Fehlerbenachrichtigung"
          body: |
            Dies ist eine absichtlich ausgelöste Testfehlermeldung.

            Der E-Mail-Versand wurde nach einem Fehler getestet.

            Repository: ${{ github.repository }}
            Workflow: ${{ github.workflow }}
            Run-ID: ${{ github.run_id }}
