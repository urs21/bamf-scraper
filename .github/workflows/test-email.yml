
name: Test Fehler-E-Mail

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Fehler simulieren
        run: exit 1

      - name: E-Mail bei Fehler senden
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: mail.gmx.net
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: ${{ secrets.MAIL_USERNAME }}
          to: knoblauch@dezim-institut.de,khalil@dezim-institut.de,harder@dezim-institut.de
          subject: "TEST: Fehler-E-Mail funktioniert"
          body: "Dies ist ein Test. GitHub hat einen Fehler erkannt und die Benachrichtigung ausgelöst."
