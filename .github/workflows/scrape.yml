name: Scrape Integration Course Finder

on:
  schedule:
    - cron: '0 7 * * *'   # jeden Tag um 07:00 UTC (09:00 MEZ)
  workflow_dispatch:       # manuell startbar
  push:
    branches:
      - main

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name:  Checkout Repository
        uses: actions/checkout@v4

      - name:  Installiere R
        uses: r-lib/actions/setup-r@v2

      - name:  Installiere R-Pakete stabil
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: httr, tidyr, sf, dplyr, tidyverse

      - name:  Starte Scraper
        run: Rscript 02_scrape_courses.R

      - name: Commit CSV falls geändert
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "urs-bot"
          git config --global user.email "urs@example.com"
          git add *.rds
          git commit -m "Update Kurse RDS" || echo "Keine Änderungen"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git push

      - name: E-Mail bei fehlgeschlagenem Workflow senden
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: mail.gmx.net
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORT }}
          from: ${{ secrets.MAIL_USERNAME }}
          to: knoblauch@dezim-institut.de,khalil@dezim-institut.de,harder@dezim-institut.de
          subject: "FEHLER: BAMF-Scraper ist fehlgeschlagen"
          body: |
            Der automatische BAMF-Scraper ist fehlgeschlagen.

            Workflow: ${{ github.workflow }}
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Ausloeser: ${{ github.event_name }}

            Details und Fehlerprotokoll:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      



